<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b8be7"/>
      <stop offset="100%" stop-color="#4a6abf"/>
    </linearGradient>
    <linearGradient id="clipGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#8ba5f0"/>
      <stop offset="100%" stop-color="#5b7bd7"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8ecf4"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <rect x="100" y="88" width="312" height="380" rx="32" fill="#1a1a2e" opacity="0.3"/>

  <!-- Clipboard board -->
  <rect x="92" y="76" width="312" height="380" rx="32" fill="url(#boardGrad)"/>

  <!-- Inner page -->
  <rect x="116" y="130" width="264" height="306" rx="16" fill="url(#pageGrad)"/>

  <!-- Text lines on page -->
  <rect x="148" y="178" width="160" height="12" rx="6" fill="#5b7bd7" opacity="0.6"/>
  <rect x="148" y="206" width="200" height="12" rx="6" fill="#5b7bd7" opacity="0.35"/>
  <rect x="148" y="234" width="120" height="12" rx="6" fill="#5b7bd7" opacity="0.35"/>
  <rect x="148" y="274" width="180" height="12" rx="6" fill="#5b7bd7" opacity="0.25"/>
  <rect x="148" y="302" width="140" height="12" rx="6" fill="#5b7bd7" opacity="0.25"/>
  <rect x="148" y="330" width="190" height="12" rx="6" fill="#5b7bd7" opacity="0.15"/>
  <rect x="148" y="358" width="100" height="12" rx="6" fill="#5b7bd7" opacity="0.15"/>

  <!-- Clip at top -->
  <rect x="192" y="52" width="112" height="56" rx="14" fill="url(#clipGrad)" stroke="#4a6abf" stroke-width="3"/>
  <rect x="216" y="60" width="64" height="16" rx="8" fill="#1a1a2e" opacity="0.25"/>

  <!-- Copy overlay (shifted second page, gives "clipboard manager" feel) -->
  <g opacity="0.9">
    <rect x="172" y="168" width="210" height="140" rx="12" fill="white" stroke="#5b7bd7" stroke-width="2.5"/>
    <rect x="196" y="192" width="120" height="10" rx="5" fill="#5b7bd7" opacity="0.7"/>
    <rect x="196" y="214" width="160" height="10" rx="5" fill="#5b7bd7" opacity="0.4"/>
    <rect x="196" y="236" width="90" height="10" rx="5" fill="#5b7bd7" opacity="0.4"/>
    <rect x="196" y="264" width="140" height="10" rx="5" fill="#5b7bd7" opacity="0.25"/>
  </g>

  <!-- Star accent (distinctive mark) -->
  <circle cx="370" cy="390" r="52" fill="#e8a84c"/>
  <path d="M370 352 l8 24 h25 l-20 15 l8 24 l-21-15 l-21 15 l8-24 l-20-15 h25 z" fill="white"/>
</svg>
